name: Refresh lockfile

on:
  push:
    branches:
      - fix/mvp-hardening-2026-09-12
    paths:
      - package.json

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mvp-hardening-2026-09-12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --package-lock-only
      - name: Commit lockfile
        run: |
          if git diff --quiet -- package-lock.json; then exit 0; fi
          git config user.name "Neuroxel CI"
          git config user.email "actions@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh lockfile after Lucide compatibility pin"
          git push origin HEAD:fix/mvp-hardening-2026-09-12
