name: Refresh lockfile

on:
  push:
    branches:
      - fix/mvp-hardening-2026-09-12
    paths:
      - package.json

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/mvp-hardening-2026-09-12

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refresh lockfile
        run: npm install --package-lock-only

      - name: Commit lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "Neuroxel CI"
          git config user.email "actions@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh lockfile after framework security upgrade"
          git push origin HEAD:fix/mvp-hardening-2026-09-12
